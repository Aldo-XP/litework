[workspace]
resolver = "2"
members = [
    "crates/litework-core",
    "crates/litework-capture",
    "crates/litework",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aldo-XP/litework"

[workspace.dependencies]
pcap-parser = "0.16"
etherparse = "0.16"
memmap2 = "0.9"
lz4_flex = "0.11"
crossbeam-channel = "0.5"
ahash = "0.8"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
